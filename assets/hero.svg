<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Y Bharath Kumar - AI Engineer, Java Full Stack Engineer, Cloud and DevOps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F2C"/>
      <stop offset="0.35" stop-color="#2A1552"/>
      <stop offset="0.7" stop-color="#6D2A86"/>
      <stop offset="1" stop-color="#E01E86"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#C724B1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#C724B1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E01E86" stop-opacity="0.45"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3DBE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FF3DBE" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="shape"><rect width="1200" height="300" rx="20" ry="20"/></clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="1160" cy="20" r="320" fill="url(#glowPink)"/>
    <circle cx="60" cy="300" r="300" fill="url(#glowCyan)"/>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" ry="19.5" fill="none" stroke="url(#edge)" stroke-width="1"/>

  <g font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="60" font-weight="700" fill="#FFFFFF">Y Bharath Kumar</text>
    <text x="600" y="197" font-size="23" font-weight="600" fill="#EBD9F5" letter-spacing="0.2">AI Engineer  |  Java Full Stack Engineer  |  Cloud &amp; DevOps</text>
    <rect x="480" y="220" width="240" height="2" rx="1" fill="url(#rule)"/>
  </g>
</svg>
