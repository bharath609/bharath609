<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Y Bharath Kumar - AI Engineer, Java Full Stack Engineer, Cloud and DevOps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F2C"/>
      <stop offset="0.35" stop-color="#2A1552"/>
      <stop offset="0.7" stop-color="#6D2A86"/>
      <stop offset="1" stop-color="#E01E86"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#C724B1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shape"><path d="M0 0 H1200 V298 L0 258 Z"/></clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <path d="M0 300 L1200 120 L1200 300 Z" fill="url(#shine)"/>
    <circle cx="1080" cy="-40" r="280" fill="#FFFFFF" fill-opacity="0.045"/>
    <circle cx="120" cy="330" r="240" fill="#00E5FF" fill-opacity="0.05"/>
  </g>

  <g font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="600" y="152" font-size="62" font-weight="700" fill="#FFFFFF">Y Bharath Kumar</text>
    <text x="600" y="199" font-size="23" font-weight="600" fill="#EBD9F5" letter-spacing="0.2">AI Engineer  |  Java Full Stack Engineer  |  Cloud &amp; DevOps</text>
    <rect x="480" y="222" width="240" height="2" rx="1" fill="url(#rule)"/>
  </g>
</svg>
